name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest -v test_organize.py

      - name: Smoke test the CLI
        run: |
          chmod +x organize.py
          ./organize.py --version
          ./organize.py config --init
          ./organize.py run --help > /dev/null
